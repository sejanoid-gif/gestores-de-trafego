<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestores de tráfego</title>
<meta name="description" content="Escolha a plataforma em que você anuncia: Facebook e Instagram, Google ou TikTok.">
<meta name="theme-color" content="#1f1e1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f1e1d;--bg2:#262624;--line:#3d3b37;--tx:#f0eee6;--mut:#a29e95;--cream:#f1ece1;--ink:#0d0d0d;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 var(--sans);min-height:100svh;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right))}
main{width:100%;max-width:460px;text-align:center}
h1{font:400 clamp(26px,7vw,34px)/1.2 'Libre Baskerville',serif;margin-bottom:10px;text-wrap:balance}
p{color:var(--mut);margin-bottom:26px}
nav{display:grid;gap:10px}
a{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:background .15s}
a:hover,a:focus-visible{background:#2f2e2b;outline:none}
a:focus-visible{box-shadow:0 0 0 2px var(--cream)}
.tile{width:46px;height:46px;flex:none;border-radius:12px;background:var(--ink);border:1px solid #333;color:var(--cream);font:400 16px/.92 'Libre Baskerville',serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
b{display:block;font-weight:650}
span.s{font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Onde você anuncia?</h1>
  <p>Escolha a plataforma e veja o gestor montar uma campanha com os seus números.</p>
  <nav>
    <a href="/facebook/"><span class="tile" aria-hidden="true"><span>FA</span><span>CL</span></span><span><b>Facebook e Instagram Ads</b><span class="s">Gerenciador de Anúncios da Meta</span></span></a>
    <a href="/google/"><span class="tile" aria-hidden="true"><span>GA</span><span>CL</span></span><span><b>Google Ads</b><span class="s">Pesquisa, Performance Max e YouTube</span></span></a>
    <a href="/tiktok/"><span class="tile" aria-hidden="true"><span>TA</span><span>CL</span></span><span><b>TikTok Ads</b><span class="s">Criativo nativo, Spark Ads e Smart+</span></span></a>
  </nav>
</main>
</body>
</html>
